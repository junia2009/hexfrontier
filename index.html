    position: fixed; z-index: 9999;
    left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column-reverse; gap: 6px;
    pointer-events: none; /* 空の入れ物が盤面のタップを食わないように */
  }
  .crashtoast {
    pointer-events: auto;
    padding: 9px 12px;
    background: rgba(70, 18, 22, 0.94);
    border: 1px solid rgba(240, 120, 120, 0.55);
    border-radius: 10px;
    color: #ffdcd8; font-size: 11.5px; line-height: 1.45;
    white-space: pre-line; word-break: break-word;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    cursor: pointer;
  }
  .crashtoast .hint { display: block; margin-top: 3px; opacity: 0.6; font-size: 10px; }

  .select-panel {
    background: linear-gradient(180deg, #17334f, #0f2439);
    border: 1px solid rgba(130, 180, 230, 0.3);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    padding: 22px 20px; width: min(420px, 92vw);
    display: flex; flex-direction: column; gap: 13px;
  }
  .select-panel h3 { font-size: 17px; color: var(--accent2); text-align: center; }

  /* ---------- 設定シート ---------- */
  /* 選択肢が増えても収まるように折り返す(ルールは4つある) */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  /* ラベルの長さに応じて幅を配分(「都市と騎士」等が改行しないように) */
  .seg button { flex: 1 1 auto; min-width: 0; padding: 9px 10px; white-space: nowrap; }
  .seg.seg-grid button { flex-basis: calc(50% - 3px); }
  .seg button.sel {
    background: linear-gradient(180deg, #ffc95e, #eda428);
    color: #4a2f00; font-weight: 700; border-color: rgba(0,0,0,0.35);
  }
  .srow { display: flex; align-items: center; gap: 10px; }
  .srow > span { width: 64px; color: var(--dim); font-size: 13px; flex: none; }
  .srow input {
    flex: 1; background: rgba(0,0,0,0.3); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  /* ---------- オンライン対戦 ---------- */
  .code-box {
    text-align: center; background: rgba(0,0,0,0.32);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px;
  }
  .code-box .code {
    font-size: 34px; font-weight: 800; letter-spacing: 9px; color: var(--accent2);
    text-shadow: 0 2px 8px rgba(0,0,0,0.6); padding-left: 9px;
  }
  .code-box small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .seat-list { display: flex; flex-direction: column; gap: 6px; }
  .seat-row {
    display: flex; align-items: center; gap: 9px;
    background: rgba(0,0,0,0.22); border: 1px solid var(--line);
    border-left: 4px solid var(--pc, var(--line));
    border-radius: 9px; padding: 8px 10px; font-size: 13.5px;
  }
  .seat-row.empty { color: var(--dim); font-style: italic; }
  .seat-row .tag {
    margin-left: auto; font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,0.09); color: var(--dim); font-style: normal;
  }
  .seat-row .tag.host { background: linear-gradient(180deg, var(--accent2), var(--accent)); color: #4a2f00; }
  .seat-row .tag.off { background: rgba(224,72,72,0.28); color: #ffc9c9; }
  .net-status {
    text-align: center; font-size: 12px; color: var(--dim);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .net-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #6d7f92; }
  .net-status.online .dot { background: #46c46a; box-shadow: 0 0 7px #46c46a; }
  .net-status.connecting .dot, .net-status.reconnecting .dot { background: var(--accent2); }
  .net-note { font-size: 12px; color: var(--dim); text-align: center; line-height: 1.6; }
  .net-err { font-size: 12.5px; color: #ffb4b4; text-align: center; }
  /* 対戦中の接続バッジ(盤面の上) */
  #netbadge {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 50%;
    transform: translateX(-50%); z-index: 60;
    background: rgba(11,26,43,0.92); border: 1px solid var(--line);
    border-top: none; border-radius: 0 0 10px 10px;
    padding: 4px 12px; font-size: 11.5px; color: var(--dim);
    display: none; align-items: center; gap: 6px; pointer-events: none;
  }
  body[data-screen="game"] #netbadge.show { display: flex; }
  #netbadge .dot { width: 7px; height: 7px; border-radius: 50%; background: #6d7f92; }
  #netbadge.online .dot { background: #46c46a; box-shadow: 0 0 6px #46c46a; }
  #netbadge.reconnecting .dot, #netbadge.connecting .dot { background: var(--accent2); }
  #netbadge.closed .dot { background: #e04848; }

  /* ---------- あそびかたデモ(自動再生)---------- */
  #demo { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  #demo[hidden] { display: none; }
  /* 再生中は下の画面を触れないようにする(台本どおりに進める) */
  .demo-shield { position: absolute; inset: 0; pointer-events: auto; }
  /* 字幕と再生バーはまとめて画面下へ。盤面と上部のHUD(点数・ダイス・蛮族)を隠さない。
     bottom は driver.js が毎フレーム測って、HUD やダイアログの上に載るよう追従させる。 */
  .demo-panel {
    position: absolute; left: 50%; bottom: 24px;
    transform: translateX(-50%);
    width: min(620px, calc(100vw - 24px));
    display: flex; flex-direction: column; gap: 7px;
    pointer-events: none;
  }
  .demo-cap {
    display: none;
    background: linear-gradient(160deg, rgba(10,26,44,0.96), rgba(8,20,36,0.96));
    border: 1px solid rgba(242,176,61,0.45);
    border-radius: 14px; padding: 12px 16px;
    font-size: 14.5px; line-height: 1.7; color: #eaf2fa;
    box-shadow: 0 10px 34px rgba(0,0,0,0.55);
  }
  .demo-cap.on { display: block; animation: demoCapIn 0.26s ease-out; }
  /* 完全に透明からは始めない ── 字幕が一瞬消えたように見えるのを避ける */
  @keyframes demoCapIn { from { opacity: 0.3; transform: translateY(6px); } }
  body.mobile .demo-cap { font-size: 13px; padding: 10px 13px; line-height: 1.65; }

  .demo-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    background: linear-gradient(160deg, rgba(10,26,44,0.96), rgba(8,20,36,0.96));
    border: 1px solid rgba(130,180,230,0.28);
    border-radius: 12px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  .demo-chapter {
    font-size: 12.5px; font-weight: 800; color: var(--accent2);
    white-space: nowrap;
  }
  .demo-prog {
    flex: 1; min-width: 24px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.18); overflow: hidden;
  }
  .demo-prog i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s ease-out;
  }
  .demo-bar button {
    padding: 7px 9px; font-size: 12.5px; min-width: 36px;
    background: rgba(13,32,52,0.92);
  }

  /* 指カーソル: 本体は点で、輪と波紋は擬似要素で描く */
  .demo-hand {
    position: absolute; left: 0; top: 0; width: 0; height: 0;
    opacity: 0;
    transition: transform 0.42s cubic-bezier(0.3, 0.8, 0.3, 1), opacity 0.2s;
  }
  .demo-hand.on { opacity: 1; }
  .demo-hand::before, .demo-hand::after {
    content: ''; position: absolute; left: -19px; top: -19px;
    width: 38px; height: 38px; border-radius: 50%;
  }
  .demo-hand::before {
    border: 2.5px solid var(--accent2);
    background: rgba(255, 217, 125, 0.18);
    box-shadow: 0 0 14px rgba(255, 217, 125, 0.55);
  }
  .demo-hand::after { border: 2px solid var(--accent2); opacity: 0; }
  .demo-hand.tap::before { animation: demoTap 0.24s ease-out; }
  .demo-hand.tap::after { animation: demoRipple 0.5s ease-out; }
  @keyframes demoTap { 50% { transform: scale(0.7); background: rgba(255, 217, 125, 0.45); } }
  @keyframes demoRipple {
    from { opacity: 0.9; transform: scale(1); }
    to { opacity: 0; transform: scale(2.4); }
  }
  .demo-target {
    box-shadow: 0 0 0 2px var(--accent2), 0 0 18px rgba(255, 217, 125, 0.65) !important;
    opacity: 1 !important;
  }

  .demo-end {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(4, 14, 26, 0.72); backdrop-filter: blur(3px);
    pointer-events: auto; animation: fadeIn 0.25s ease-out;
  }
  .demo-end.on { display: flex; }
  .demo-end-card {
    background: linear-gradient(180deg, #17334f, #0f2439);
    border: 1px solid rgba(130, 180, 230, 0.3);
    border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    padding: 20px; width: min(440px, 92vw);
    display: flex; flex-direction: column; gap: 14px;
    animation: popIn 0.24s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .demo-end-card h3 { font-size: 17px; color: var(--accent2); text-align: center; }
  .demo-end-card .row { flex-direction: column; }
  .demo-end-card button { padding: 12px 14px; font-size: 14px; }

  /* 説明書からデモを開く導線 */
  .demo-cta {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    background: linear-gradient(180deg, #ffc95e, #eda428);
    color: #4a2f00; border-color: rgba(0,0,0,0.35);
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    padding: 11px 14px; width: 100%; white-space: normal; text-align: left;
  }
  .demo-cta small { font-weight: 600; opacity: 0.72; font-size: 11px; }

  .logsheet {
    max-height: 55dvh; overflow-y: auto; font-size: 12.5px; color: var(--dim);
    line-height: 1.8; padding-right: 4px;
  }
  .logsheet div:last-child { color: var(--text); }

  /* ---------- モバイル(縦持ちスマホ) ---------- */
  body.mobile {
    height: 100dvh;
  }
  body.mobile #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 6;
    background: linear-gradient(180deg, rgba(10,25,42,0.92), rgba(10,25,42,0.75));
    border-bottom: none; box-shadow: none;
    padding: 6px 10px;
    padding-top: calc(6px + env(safe-area-inset-top));
    flex-wrap: nowrap;
  }
  body.mobile #topbar h1 { font-size: 15px; }
  body.mobile .mobile-only { display: inline-block; }

  body.mobile #main { display: block; }
  body.mobile #board-wrap { position: fixed; inset: 0; }
  body.mobile #board3d canvas, body.mobile #board { touch-action: none; }

  /* サイド → 上部オーバーレイ(プレイヤーチップ横並び、ログ非表示) */
  body.mobile #side {
    position: fixed; z-index: 5;
    top: calc(44px + env(safe-area-inset-top));
    left: 0; right: 0; width: auto;
    background: none; border: none; backdrop-filter: none;
    pointer-events: none;
  }
  body.mobile #players {
    flex-direction: row; gap: 5px; padding: 6px 8px;
    pointer-events: auto;
  }
  body.mobile .player {
    flex: 1 1 0; min-width: 0; padding: 5px 6px;
    background: rgba(11, 26, 43, 0.85); border-radius: 10px;
    transition: none;
  }
  body.mobile .player.active { transform: none; }
  body.mobile .player .prow { gap: 5px; flex-wrap: nowrap; justify-content: center; }
  /* チップはアバター+点数のみ(名前はタップ展開時に表示) */
  body.mobile .pname { display: none; font-size: 11px; }
  body.mobile .player.expanded .pname { display: block; }
  body.mobile .ppts { font-size: 15px; flex: none; margin-left: 0; }
  body.mobile .chip { width: 21px; height: 21px; }
  body.mobile .player .pinfo { display: none; }
  /* 展開中は幅を広げ、情報を折り返す(横1行だとチップからはみ出す) */
  body.mobile .player.expanded { flex: 2 1 auto; }
  /* 展開中は他のチップが狭くなるので、目標点(/13)を省いて見切れを防ぐ */
  body.mobile #players:has(.expanded) .player:not(.expanded) .ppts small { display: none; }
  body.mobile .player.expanded .pinfo {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 3px 9px; font-size: 10.5px; margin-top: 3px;
  }
  body.mobile #barb {
    pointer-events: auto; align-self: flex-start;
    background: rgba(11, 26, 43, 0.85); border-radius: 10px;
    margin: 4px 8px 0; padding: 4px 10px; font-size: 11px;
  }
  body.mobile .bcell { width: 15px; height: 15px; font-size: 10px; }
  body.mobile .bdef { margin-left: 8px; }
  body.mobile #dice {
    pointer-events: auto; align-self: flex-start;
    background: rgba(11, 26, 43, 0.85); border-radius: 10px;
    margin: 4px 8px 0; padding: 5px 10px;
  }
  body.mobile .die { width: 26px; height: 26px; padding: 4px; border-radius: 6px; }
  body.mobile .evdie { width: 26px; height: 26px; font-size: 14px; }
  body.mobile .dsum { font-size: 16px; }
  body.mobile #log { display: none; }

  /* 下部 → オーバーレイ。手札はシート開閉 */
  body.mobile #bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    background: linear-gradient(180deg, rgba(10,25,42,0), rgba(10,25,42,0.88) 26%);
    border-top: none; box-shadow: none;
    padding: 14px 10px 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    gap: 6px;
  }
  body.mobile #status { font-size: 12.5px; min-height: 24px; flex-wrap: wrap; }
  body.mobile #status button { padding: 8px 14px; }
  body.mobile #handrow { flex-direction: column; align-items: stretch; gap: 6px; }
  body.mobile #hand {
    flex-direction: column; flex-wrap: nowrap; gap: 5px;
    max-height: 34dvh; overflow-y: auto;
  }
  /* 資源+商品は均等幅で必ず1行に収める */
  body.mobile #hand .hrow { display: flex; gap: 4px; }
  body.mobile #hand .hrow.main .card {
    flex: 1 1 0; min-width: 0; max-width: none; width: auto;
  }
  /* 進歩/発展カードは枚数可変なので固定幅+折返し */
  body.mobile #hand .hrow.extra { flex-wrap: wrap; gap: 5px; }
  body.mobile #hand .hrow.extra .card { flex: 0 0 60px; }
  body.mobile #hand .sep { display: none; }
  body.mobile .card { width: 50px; padding: 4px 3px; border-radius: 7px; }
  body.mobile .card .icon { font-size: 15px; }
  body.mobile .card .label { font-size: 8.5px; }
  body.mobile .card .cnt { font-size: 14px; }
  body.mobile #bottom { overflow: hidden; }
  body.mobile #handrow { min-width: 0; }
  body.mobile #controls {
    margin-left: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
  }
  body.mobile #controls button {
    padding: 11px 0; font-size: 12px;
    white-space: nowrap; overflow: hidden;
    min-width: 0; width: 100%;
  }
  body.mobile button .stock {
    margin-left: 3px; min-width: 12px; padding: 0 2px; font-size: 9px; line-height: 13px;
  }

  /* ダイアログ → ボトムシート */
  body.mobile .overlay { align-items: flex-end; }
  body.mobile .dialog {
    width: 100vw; max-width: 100vw; min-width: 0;
    border-radius: 18px 18px 0 0; border-bottom: none;
    padding: 18px 16px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    max-height: 78dvh; overflow-y: auto;
    animation: sheetIn 0.24s cubic-bezier(0.2, 1.1, 0.4, 1);
  }
  @keyframes sheetIn { from { transform: translateY(40%); opacity: 0.4; } to { transform: none; opacity: 1; } }
  body.mobile .pick { min-width: 58px; padding: 9px 5px; }
  body.mobile .gain { font-size: 13px; }
</style>

<body>
  <div id="topbar">

  <div id="screen-select" class="screen">
